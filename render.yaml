# Blueprint do Render. Alternativa: criar o servico pelo painel com o mesmo
# build command e start command — o resultado e igual, e o painel nao depende
# deste arquivo estar correto.
#
# Este blueprint NAO provisiona banco no Render, de proposito. O Postgres vem de
# fora, na Neon, e chega pela variavel DATABASE_URL. O Postgres gratuito do
# Render e apagado depois de 30 dias corridos, prazo menor que a janela do
# piloto.
#
# DATABASE_URL esta marcada com `sync: false`: o Render pede o valor na criacao
# do blueprint em vez de guarda-lo aqui — a string da Neon carrega a senha do
# banco e nao pode ser versionada. Se ela ficar em branco, o app sobe com SQLite
# no disco efemero e perde os dados coletados no proximo deploy; conferir que
# esta preenchida antes de qualquer aplicacao com alunos.
services:
  - name: mvp-kst
    type: web
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 3 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
